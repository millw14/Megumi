<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Megumi's Soul</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            overflow: hidden;
            background: transparent;
            width: 100%;
            height: 100%;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.min.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        let scene, camera, renderer, currentVrm, clock;
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;
        let time = 0;
        let blinkTimer = 0;
        let nextBlink = 3;
        let isWatching = false;
        let watchingGlow = null;

        init();

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                premultipliedAlpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.setClearColor(0x000000, 0);
            document.body.appendChild(renderer.domElement);

            // Camera
            camera = new THREE.PerspectiveCamera(20, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.85, 5.5);
            camera.lookAt(0, 0.8, 0);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.3));
            const frontLight = new THREE.DirectionalLight(0xffffff, 0.7);
            frontLight.position.set(0.5, 1.5, 2);
            scene.add(frontLight);

            // Load VRM
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load('/assets/models/megumi_chan.vrm',
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    currentVrm = vrm;
                    scene.add(vrm.scene);

                    VRMUtils.rotateVRM0(vrm);

                    const box = new THREE.Box3().setFromObject(vrm.scene);
                    vrm.scene.position.y = -box.min.y;

                    vrm.scene.traverse((obj) => {
                        if (obj.isMesh || obj.isSkinnedMesh) {
                            obj.frustumCulled = false;
                            if (obj.material) {
                                obj.material.side = THREE.DoubleSide;
                                obj.material.needsUpdate = true;
                            }
                        }
                    });

                    // Shadow
                    const shadowGeo = new THREE.CircleGeometry(0.35, 32);
                    const shadowMat = new THREE.MeshBasicMaterial({
                        color: 0x000000,
                        transparent: true,
                        opacity: 0.2,
                        side: THREE.DoubleSide
                    });
                    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
                    shadow.rotation.x = -Math.PI / 2;
                    shadow.position.y = 0.01;
                    scene.add(shadow);

                    console.log('Megumi has awakened!');
                    animate();
                },
                null,
                (error) => console.error('Failed to awaken Megumi:', error)
            );

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Mouse tracking - simple screen coordinates
            // We get cursor position as percentage of screen
            window.addEventListener('mousemove', (e) => {
                // 0 to 1 range, where 0=left/top, 1=right/bottom
                targetMouseX = e.clientX / window.innerWidth;
                targetMouseY = e.clientY / window.innerHeight;
            });

            // From Python: same 0-1 range
            window.setGlobalMouse = (x, y) => {
                // Python sends -1 to +1, convert to 0 to 1
                targetMouseX = (x + 1) / 2;
                targetMouseY = (-y + 1) / 2;  // Python Y is inverted
            };

            window.setWatchingMode = (watching) => {
                isWatching = watching;
                if (watching) {
                    if (!watchingGlow) {
                        const glowGeo = new THREE.RingGeometry(0.5, 0.55, 32);
                        const glowMat = new THREE.MeshBasicMaterial({
                            color: 0xff6b9d,
                            transparent: true,
                            opacity: 0.3,
                            side: THREE.DoubleSide
                        });
                        watchingGlow = new THREE.Mesh(glowGeo, glowMat);
                        watchingGlow.rotation.x = -Math.PI / 2;
                        watchingGlow.position.y = 0.02;
                        scene.add(watchingGlow);
                    }
                    watchingGlow.visible = true;
                } else {
                    if (watchingGlow) watchingGlow.visible = false;
                }
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = clock.getDelta();
            time += dt;
            blinkTimer += dt;

            // Smooth tracking
            mouseX = THREE.MathUtils.lerp(mouseX, targetMouseX, 0.15);
            mouseY = THREE.MathUtils.lerp(mouseY, targetMouseY, 0.15);

            if (currentVrm) {
                const humanoid = currentVrm.humanoid;
                const em = currentVrm.expressionManager;

                // === IDLE ANIMATIONS ===
                const leftArm = humanoid?.getNormalizedBoneNode('leftUpperArm');
                const rightArm = humanoid?.getNormalizedBoneNode('rightUpperArm');
                const leftLower = humanoid?.getNormalizedBoneNode('leftLowerArm');
                const rightLower = humanoid?.getNormalizedBoneNode('rightLowerArm');

                const armSwing = Math.sin(time * 0.8) * 0.02;
                
                if (leftArm) {
                    leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 1.0 + armSwing, 0.03);
                    leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.15, 0.03);
                }
                if (rightArm) {
                    rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -1.0 - armSwing, 0.03);
                    rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0.15, 0.03);
                }
                if (leftLower) leftLower.rotation.y = THREE.MathUtils.lerp(leftLower.rotation.y, -0.15, 0.03);
                if (rightLower) rightLower.rotation.y = THREE.MathUtils.lerp(rightLower.rotation.y, 0.15, 0.03);

                const spine = humanoid?.getNormalizedBoneNode('spine');
                const chest = humanoid?.getNormalizedBoneNode('chest');
                
                if (spine) spine.rotation.x = Math.sin(time * 1.2) * 0.006;
                if (chest) chest.rotation.x = Math.sin(time * 1.2) * 0.008;

                // === BLINKING ===
                if (blinkTimer >= nextBlink && em) {
                    blinkTimer = 0;
                    nextBlink = 2 + Math.random() * 4;
                    doBlink(em);
                }

                // === WATCHING GLOW ===
                if (watchingGlow && watchingGlow.visible) {
                    watchingGlow.material.opacity = 0.25 + Math.sin(time * 3) * 0.1;
                    watchingGlow.scale.setScalar(1 + Math.sin(time * 2) * 0.03);
                }

                // === CURSOR TRACKING ===
                // mouseX: 0=left, 1=right
                // mouseY: 0=top, 1=bottom
                
                const head = humanoid?.getNormalizedBoneNode('head');
                const neck = humanoid?.getNormalizedBoneNode('neck');

                // Convert to centered coords: -0.5 to +0.5
                const cx = mouseX - 0.5;  // negative=left, positive=right
                const cy = mouseY - 0.5;  // negative=top, positive=bottom

                // FLIPPED signs to fix inversion
                const headTurnY = cx * 0.9;
                const headTiltX = -cy * 0.6;
                
                const neckTurnY = cx * 0.3;
                const neckTiltX = -cy * 0.25;

                if (head) {
                    head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, headTurnY, 0.12);
                    head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, headTiltX, 0.12);
                }
                if (neck) {
                    neck.rotation.y = THREE.MathUtils.lerp(neck.rotation.y, neckTurnY, 0.1);
                    neck.rotation.x = THREE.MathUtils.lerp(neck.rotation.x, neckTiltX, 0.1);
                }

                // Body follows
                if (spine) spine.rotation.y = THREE.MathUtils.lerp(spine.rotation.y, cx * 0.15, 0.05);
                if (chest) chest.rotation.y = THREE.MathUtils.lerp(chest.rotation.y, cx * 0.1, 0.05);

                // Eyes - flipped X, adjusted Y
                if (currentVrm.lookAt) {
                    try {
                        const lookTarget = new THREE.Vector3(
                            -cx * 5,
                            1.0 + cy * 1.2,
                            3
                        );
                        currentVrm.lookAt.lookAt(lookTarget);
                    } catch(e) {}
                }

                currentVrm.update(dt);
            }

            renderer.render(scene, camera);
        }

        let isBlinking = false;
        function doBlink(em) {
            if (!em || isBlinking) return;
            isBlinking = true;
            let progress = 0;
            
            const anim = setInterval(() => {
                progress += 0.25;
                if (progress <= 1) {
                    em.setValue('blink', progress);
                } else if (progress <= 2) {
                    em.setValue('blink', 2 - progress);
                } else {
                    em.setValue('blink', 0);
                    isBlinking = false;
                    clearInterval(anim);
                }
            }, 20);
        }
    </script>
</body>
</html>
