[package]
name = "megumi"
version = "0.1.0"
edition = "2021"
description = "Megumi: Your Growing Digital Soulmate — a pure-Rust autonomous AI companion"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5.0"
hf-hub = "0.5"
tokenizers = "0.20"
user-idle-time = "0.7"
tray-icon = "0.21"
image = "0.25"
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
